# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: telecom-fabric-foundry
metadata:
  template: telecom-fabric-foundry@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/preprovision.ps1
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
