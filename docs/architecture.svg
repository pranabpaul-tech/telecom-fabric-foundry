  <rect class="n-fnd" x="500" y="492" width="220" height="78" rx="7"/>
  <text class="t" x="512" y="514">Orchestrator (hosted)</text>
  <text class="m" x="512" y="532">telco-orchestrator</text>
  <text class="s" x="512" y="550">Agent Framework; routes</text>
  <text class="s" x="512" y="564">data / knowledge / both</text>

  <text class="lbl" x="711" y="413">read-only KQL tools</text>

  <rect class="n-fnd" x="500" y="600" width="220" height="56" rx="7"/>
  <text class="t" x="512" y="622">Toolbox (Data Agent)</text>
  <text class="m" x="512" y="642">fabric-dataagent-obo</text>
  <text class="lbl" x="492" y="413">user token (OBO)</text>

  <rect class="n-fnd" x="280" y="600" width="190" height="56" rx="7"/>
  <text class="t" x="292" y="622">Models</text>
  <text class="m" x="292" y="642">gpt-4.1 · text-emb-3-large</text>

  <text class="lbl" x="560" y="582">MCP</text>

  <rect class="n-azr" x="280" y="668" width="440" height="66" rx="7"/>
  <text class="t" x="292" y="688">Private endpoints in snet-pe</text>
  <text class="s" x="292" y="706">Search · agent Storage · Cosmos · Key Vault · ACR</text>
  <text class="s" x="292" y="722">ACI jumpbox in snet-container (only after lock-down)</text>

  <rect class="n-azr" x="760" y="490" width="200" height="64" rx="7"/>
  <text class="t" x="772" y="512">Azure Bot Service</text>
  <text class="m" x="772" y="530">bot-telco-orchestrator</text>
  <text class="s" x="772" y="546">Teams channel</text>

  <rect class="n-azr" x="760" y="566" width="200" height="78" rx="7"/>
  <text class="t" x="772" y="588">Foundry IQ KB</text>
  <text class="m" x="772" y="606">telco-kb on AI Search</text>
  <text class="s" x="772" y="622">semantic ranker,</text>
  <text class="s" x="772" y="637">agentic retrieval</text>

  <rect class="n-azr" x="760" y="666" width="200" height="62" rx="7"/>
  <text class="t" x="772" y="688">Blob kb-docs</text>
  <text class="s" x="772" y="706">6 synthetic documents,</text>
  <text class="s" x="772" y="721">same files every deploy</text>

  <rect class="n-azr" x="760" y="740" width="200" height="72" rx="7"/>
  <text class="t" x="772" y="762">Platform</text>
  <text class="s" x="772" y="780">Cosmos + Storage (agent state)</text>
  <text class="s" x="772" y="796">Key Vault · ACR · App Insights</text>

  <text class="s" x="256" y="786">Lock-down (last): Foundry, AI Search and KB storage public access off;</text>
  <text class="s" x="256" y="802">Teams keeps working through the Bot Service route. Fabric private link is optional.</text>
  <text class="s" x="256" y="830">Showcase question: "Drops spiked in Gauteng in the last hour. Which towers</text>
  <text class="s" x="256" y="846">are affected, is there planned maintenance, does this breach any enterprise</text>
  <text class="s" x="256" y="862">SLA, and what should the field team do?"</text>
