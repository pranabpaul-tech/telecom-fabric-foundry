  <text class="m" x="46" y="170">01_jumpstart.py</text>
  <text class="m" x="46" y="186">02_patch_emulator.py</text>
  <text class="m" x="46" y="202">03_kql_schema.py</text>
  <text class="m" x="46" y="218">04_ops_agent.py</text>
  <text class="m" x="46" y="234">05_data_agent.py</text>
  <rect class="n-loc" x="34" y="262" width="172" height="100" rx="7"/>
  <text class="t" x="46" y="284">Seed and documents</text>
  <text class="m" x="46" y="304">seed/towers.csv</text>
  <text class="m" x="46" y="320">kb-docs/*.md (6)</text>
  <text class="s" x="46" y="338">one source of tower IDs</text>
  <text class="s" x="46" y="353">for data and documents</text>
  <rect class="n-loc" x="34" y="560" width="172" height="134" rx="7"/>
  <text class="t" x="46" y="582">Azure and Foundry</text>
  <text class="m" x="46" y="602">azd provision (Bicep)</text>
  <text class="m" x="46" y="618">upload_docs.py</text>
  <text class="m" x="46" y="634">create_kb.py</text>
  <text class="m" x="46" y="650">create_toolbox.py</text>
  <text class="m" x="46" y="666">deploy_hosted_agent.py</text>
  <text class="m" x="46" y="682">publish_teams.py</text>
  <rect class="n-loc" x="34" y="710" width="172" height="76" rx="7"/>
  <text class="t" x="46" y="732">Validate</text>
  <text class="m" x="46" y="752">run_spike.py</text>
  <text class="m" x="46" y="768">smoke_*.py, run_evals.py</text>
  <text class="lbl" x="208" y="180">REST</text>
  <text class="lbl" x="208" y="620">ARM</text>

  <!-- Fabric -->
  <rect class="p-fab" x="240" y="70" width="740" height="330" rx="10"/>
  <text class="ph ph-fab" x="256" y="94">Microsoft Fabric · workspace telco-cdr-jumpstart · capacity telcof8 (F8)</text>

  <rect class="n-fab" x="260" y="120" width="150" height="64" rx="7"/>
  <text class="t" x="272" y="142">Emulator notebook</text>
  <text class="s" x="272" y="159">+ tower_id, region</text>
  <text class="s" x="272" y="174">+ spike mode</text>

  <rect class="n-fab" x="440" y="120" width="160" height="64" rx="7"/>
  <text class="t" x="452" y="142">Eventstream</text>
  <text class="m" x="452" y="159">TelecomCallData-</text>
  <text class="m" x="452" y="174">RecordsStream</text>

  <rect class="n-fab" x="630" y="110" width="330" height="110" rx="7"/>
  <text class="t" x="644" y="132">Eventhouse DemosEH</text>
  <text class="m" x="644" y="150">KQL DB TelecomCallDataRecords</text>
  <text class="m" x="644" y="170">cdr_raw (+ tower_id, region)</text>
  <text class="m" x="644" y="186">towers · mv_drops_5m (5-min bins)</text>
  <text class="m" x="644" y="202">drop_rate_by_region() · worst_towers()</text>

  <text class="lbl" x="420" y="214">NL → KQL</text>
  <text class="lbl" x="644" y="244" text-anchor="end">every 5 min</text>

  <rect class="n-fab" x="260" y="260" width="230" height="70" rx="7"/>
  <text class="t" x="272" y="282">Fabric Data Agent</text>
  <text class="m" x="272" y="300">TalkToTelecomCdr</text>
