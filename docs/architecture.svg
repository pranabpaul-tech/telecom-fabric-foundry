  <rect class="n-fab" x="520" y="260" width="170" height="70" rx="7"/>
  <text class="t" x="532" y="282">Operations Agent</text>
  <text class="m" x="532" y="300">Telco Drop Monitor</text>
  <text class="s" x="532" y="318">DCR &gt; 15%, ≥ 50 calls</text>

  <rect class="n-fab" x="720" y="260" width="150" height="70" rx="7"/>
