<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-label="Planned architecture of the telecom NOC copilot. Scripts on the local machine deploy Azure with Bicep and build Fabric items over REST. In Fabric, an emulator notebook streams call data records through an Eventstream into an Eventhouse. An Operations Agent checks drop rates every five minutes and sends alerts through Activator and Power Automate as Outlook email. A Fabric Data Agent answers questions over KQL. In Azure, a VNet-injected Foundry project hosts an orchestrator agent, published to Teams through Bot Service, which calls the Fabric Data Agent with the user's token, runs read-only KQL, and asks a Telecom Knowledge agent grounded on a Foundry IQ knowledge base over Blob documents.">
  <title>Telecom Fabric Foundry: planned architecture</title>
  <desc>Planned architecture of the telecom NOC copilot. Scripts on the local machine deploy Azure with Bicep and build Fabric items over REST. In Fabric, an emulator notebook streams call data records through an Eventstream into an Eventhouse. An Operations Agent checks drop rates every five minutes and sends alerts through Activator and Power Automate as Outlook email. A Fabric Data Agent answers questions over KQL. In Azure, a VNet-injected Foundry project hosts an orchestrator agent, published to Teams through Bot Service, which calls the Fabric Data Agent with the user's token, runs read-only KQL, and asks a Telecom Knowledge agent grounded on a Foundry IQ knowledge base over Blob documents.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <style>
    svg {
      --bg: #f3f5f8; --surface: #ffffff; --ink: #16212c; --muted: #56667a; --line: #c6d1dc;
      --fabric: #0b8574;  --fabric-bg: #e2f3ef;
      --azure: #2466cf;   --azure-bg: #e5edfa;
      --foundry: #6642c4; --foundry-bg: #ece7f9;
      --local: #9c5a00;   --local-bg: #faf0dd;
      --m365: #a3366b;    --m365-bg: #f8e6ef;
      --font: system-ui, "Segoe UI", -apple-system, "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0e141a; --surface: #151d25; --ink: #e5ecf3; --muted: #9aabbc; --line: #34424f;
        --fabric: #45d0ba;  --fabric-bg: #10352f;
        --azure: #7aa9f6;   --azure-bg: #14284a;
        --foundry: #ae92f2; --foundry-bg: #281f47;
        --local: #eaad52;   --local-bg: #37280f;
        --m365: #ec8ab8;    --m365-bg: #3a1a2b;
      }
    }
    svg { font-family: var(--font); color: var(--ink); }
    .page { fill: var(--surface); }
    .p-loc { fill: var(--local-bg); stroke: var(--local); stroke-width: 1.2; }
    .p-fab { fill: var(--surface); stroke: var(--fabric); stroke-width: 1.4; }
    .p-azr { fill: var(--surface); stroke: var(--azure); stroke-width: 1.4; }
    .p-vnet { fill: var(--azure-bg); stroke: var(--azure); stroke-width: 1; stroke-dasharray: 5 4; }
    .p-m365 { fill: var(--surface); stroke: var(--m365); stroke-width: 1.4; }
    .n-fab { fill: var(--fabric-bg); stroke: var(--fabric); stroke-width: 1.3; }
    .n-azr { fill: var(--surface); stroke: var(--azure); stroke-width: 1.3; }
    .n-fnd { fill: var(--foundry-bg); stroke: var(--foundry); stroke-width: 1.4; }
    .n-loc { fill: var(--surface); stroke: var(--local); stroke-width: 1.2; }
    .n-m365 { fill: var(--m365-bg); stroke: var(--m365); stroke-width: 1.3; }
    .title { font-size: 20px; font-weight: 700; fill: var(--ink); }
    .subtitle { font-size: 12.5px; fill: var(--muted); }
    .ph { font-size: 13px; font-weight: 700; }
    .ph-fab { fill: var(--fabric); } .ph-azr { fill: var(--azure); } .ph-loc { fill: var(--local); } .ph-m365 { fill: var(--m365); } .ph-fnd { fill: var(--foundry); }
    .t { font-size: 13.5px; font-weight: 600; fill: var(--ink); }
    .s { font-size: 11.5px; fill: var(--muted); }
    .m { font-size: 11px; font-family: var(--mono); fill: var(--muted); }
    .lbl { font-size: 10.5px; fill: var(--muted); }
    .a { fill: none; stroke: var(--muted); stroke-width: 1.5; marker-end: url(#ah); }
    .ah { fill: var(--muted); }
  </style>

  <rect class="page" x="0" y="0" width="1240" height="900"/>
  <text class="title" x="20" y="34">Telecom NOC copilot on Fabric Real-Time Intelligence and Microsoft Foundry</text>
  <text class="subtitle" x="20" y="54">Planned architecture (nothing deployed yet). Region: Sweden Central, with UK South as the fallback. All data is synthetic.</text>

  <!-- Local machine -->
